<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodo de confort · Caja 3D</title>
<style>
  :root { --bg:#0d0d10; --panel:rgba(22,22,27,.92); --gold:#d4af37; --text:#ece7d8; --muted:#8d8a80; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:radial-gradient(ellipse at 50% 35%, #1d1d24 0%, var(--bg) 70%); color:var(--text);
               font-family:system-ui, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #app { position:relative; width:100%; height:100%; min-height:380px; }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
  .toolbar { position:absolute; top:12px; left:12px; right:12px; display:flex; flex-wrap:wrap; gap:8px; z-index:5; }
  button { background:var(--panel); color:var(--gold); border:1px solid rgba(212,175,55,.45); padding:8px 12px; border-radius:8px;
           cursor:pointer; font:600 13px system-ui, sans-serif; }
  button:hover { background:rgba(212,175,55,.16); }
  button.on { background:var(--gold); color:#14120a; }
  .sep { flex:1 1 auto; }
  .pill { align-self:center; font-size:12px; color:var(--muted); background:var(--panel); border:1px solid rgba(255,255,255,.08);
          padding:6px 10px; border-radius:999px; }
  .pill i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--gold); margin-right:6px; }
  .label { position:absolute; left:0; top:0; transform:translate(-50%,-115%); background:var(--panel); border:1px solid rgba(212,175,55,.6);
           border-radius:8px; padding:4px 9px; font-size:12px; white-space:nowrap; cursor:pointer; z-index:3; transition:opacity .15s; }
  .label b { display:block; color:var(--gold); font-size:10px; letter-spacing:.06em; text-transform:uppercase; }
  .label.sel { outline:2px solid var(--gold); }
  .label.off { opacity:0; pointer-events:none; }
  #info { position:absolute; left:12px; bottom:12px; max-width:320px; background:var(--panel); border:1px solid rgba(212,175,55,.45);
          border-radius:12px; padding:12px 14px; z-index:5; display:none; }
  #info h3 { margin:0 0 2px; color:var(--gold); font-size:15px; }
  #info .tp { color:var(--muted); font-size:11px; font-family:ui-monospace, Consolas, monospace; margin-bottom:6px; word-break:break-all; }
  #info .val { font-size:22px; font-weight:700; margin:2px 0 6px; }
  #info p { margin:0; font-size:12px; color:#c9c4b4; line-height:1.4; }
  #cargando { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--gold); z-index:9;
              background:rgba(13,13,16,.8); font-size:14px; }
</style>
</head>
<body>
<div id="app">
  <div id="cargando">Cargando modelo 3D…</div>
  <div class="toolbar">
    <button id="bTapa">Abrir tapa</button>
    <button id="bHover" title="Abre la tapa al pasar el mouse por encima">Abrir con el mouse</button>
    <button id="bEtiq" class="on">Etiquetas</button>
    <button id="bCables" class="on">Cables</button>
    <button id="bRot">Auto-rotar</button>
    <button data-vista="frente">Frente</button>
    <button data-vista="izq">Izquierda</button>
    <button data-vista="der">Derecha</button>
    <button data-vista="arriba">Arriba</button>
    <span class="sep"></span>
    <span class="pill" id="modo"><i></i>Simulación</span>
  </div>
  <div id="info"><h3></h3><div class="tp"></div><div class="val"></div><p></p></div>
</div>

<!-- Para abrirlo con doble clic (file://) el modelo va embebido en este archivo; si no existe se intenta cargar el .glb -->
<script src="modelo_glb_realista.js"></script>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const GLB_URL = 'caja_estanca_realista.glb';
const SIMULAR = !window.CAJA3D_SIN_SIMULACION;      // poné window.CAJA3D_SIN_SIMULACION = true antes de cargar si solo querés datos reales
const BASE_TOPICO = '6to_info/A/G4/';

// ===== AJUSTES QUE PODÉS TOCAR =====
const AJUSTES = {
  exposicion: 0.75,          // brillo general de la imagen
  entorno: 0.5,              // intensidad de la luz ambiente (reflejos)
  luzDirecta: 0.55,          // intensidad de la luz principal
  brilloMateriales: 0.92,    // 1 = colores originales; menos = más oscuros
  metalMaximo: 0.3,          // limita lo metálico
};
const ANGULO_APERTURA = Math.PI;          // 180°: la tapa queda parada sobre la caja
const PIVOTE = [0, 0.105, 0.0285];        // bisagra: borde superior de la tapa (metros)
const PARTES_TAPA = ['caja_tapa', 'lcd_20x4', 'pir_hcsr501'];    // lo que gira con la tapa
const VISTA_CERRADA = [[0.32, 0.22, 0.5], [0, 0, 0]];
const VISTA_ABIERTA = [[0.3, 0.2, 0.78], [0, 0.1, 0.02]];

// Posiciones en metros (centro de la caja = origen, +Z hacia el frente), con la tapa cerrada
const SENSORES = {
  confort:     { nodo:'lcd_20x4',    titulo:'LCD 20x4',      pos:[-0.001, 0.0635, 0.054], n:[0,0,1],  tapa:true,
                 desc:'Pantalla de 20 columnas x 4 filas con módulo I²C. Muestra el índice de confort calculado por el ESP32.' },
  presencia:   { nodo:'pir_hcsr501', titulo:'PIR HC-SR501',  pos:[0.072, 0.066, 0.0565],  n:[0,0,1],  tapa:true,
                 desc:'Sensor de movimiento infrarrojo. Detecta si hay personas en el ambiente.' },
  gases:       { nodo:'mq135',       titulo:'MQ-135',        pos:[-0.108, 0.072, -0.006], n:[-1,0,0],
                 desc:'Calidad del aire: detecta CO₂, amoníaco, benceno y otros gases.' },
  temperatura: { nodo:'dht22',       titulo:'DHT22',         pos:[0.104, 0.061, -0.016],  n:[1,0,0],
                 desc:'Temperatura y humedad relativa del ambiente.', extra:'humedad' },
  ruido:       { nodo:'inmp441',     titulo:'INMP441',       pos:[-0.071, 0.103, -0.016], n:[0,1,0],
                 desc:'Micrófono MEMS I²S. El ESP32 calcula el nivel de ruido a partir de su señal.' },
  luz:         { nodo:'bh1750',      titulo:'BH1750',        pos:[0.057, 0.103, -0.016],  n:[0,1,0],
                 desc:'Sensor de luz ambiente (lux).' },
};
// Cables del LCD y del PIR: se dibujan acá porque tienen que seguir a la tapa cuando se abre
const CABLES_TAPA = {
  lcd: { placa:[-0.023, 0.032, -0.0219], tapa:[-0.0435, 0.0832, 0.03355], fila:[0,1,0], colores:[0x1c1c1e, 0xce2424, 0x2eaa4c, 0xecc428] },
  pir: { placa:[-0.023, 0.020, -0.0219], tapa:[ 0.0622, 0.06665, 0.0337], fila:[0,1,0], colores:[0xce2424, 0xecc428, 0x1c1c1e],
         cerrada:[[-0.018, 0.040, -0.014], [0.040, 0.052, 0.016]] },   // ruta con la tapa cerrada: sube por el costado de la batería y pasa por arriba
};
const LARGO_CABLE = 0.125;   // largo "real" del cable: cerrada sobra y forma un bucle; abierta queda tensa

const num = v => { const x = parseFloat(String(v).replace(',', '.')); return Number.isFinite(x) ? x : null; };
const FORMATO = {
  temperatura: v => num(v) === null ? String(v) : `${num(v).toFixed(1)} °C`,
  humedad:     v => num(v) === null ? String(v) : `${Math.round(num(v))} %`,
  luz:         v => num(v) === null ? String(v) : `${Math.round(num(v))} lx`,
  ruido:       v => num(v) === null ? String(v) : `${Math.round(num(v))} dB`,
  gases:       v => num(v) === null ? String(v) : `${Math.round(num(v))}`,
  presencia:   v => ['si','sí','1','true','on'].includes(String(v).trim().toLowerCase()) ? 'Presencia' : 'Sin presencia',
  confort:     v => String(v),
};
const datos = {};

// ---------- escena e iluminación ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = AJUSTES.exposicion;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = AJUSTES.entorno;
const sun = new THREE.DirectionalLight(0xffffff, AJUSTES.luzDirecta); sun.position.set(0.5, 1, 1); scene.add(sun);

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 10);
camera.position.set(...VISTA_CERRADA[0]);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 0.1; controls.maxDistance = 1.5; controls.autoRotateSpeed = 1.2;
controls.addEventListener('start', () => { anim = null; });

function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(app); resize();

// ---------- etiquetas ----------
const etiquetas = {};
for (const [k, s] of Object.entries(SENSORES)) {
  const el = document.createElement('div'); el.className = 'label';
  el.innerHTML = `<b>${s.titulo}</b><span class="v">—</span>`;
  el.addEventListener('click', e => { e.stopPropagation(); seleccionar(k); });
  app.appendChild(el); etiquetas[k] = el;
}
function textoSensor(k) {
  const s = SENSORES[k], v = datos[k];
  let t = v === undefined ? '—' : FORMATO[k](v);
  if (s.extra && datos[s.extra] !== undefined) t += ` · ${FORMATO[s.extra](datos[s.extra])}`;
  return t;
}
function refrescarTextos() {
  pintarLCD();
  for (const k in SENSORES) etiquetas[k].querySelector('.v').textContent = textoSensor(k);
  if (seleccion) document.querySelector('#info .val').textContent = textoSensor(seleccion);
}

// ---------- pantalla del LCD 20x4 (muestra los datos reales como el LCD de la caja) ----------
const lcdCanvas = document.createElement('canvas'); lcdCanvas.width = 1024; lcdCanvas.height = 340;
const lcdCtx = lcdCanvas.getContext('2d');
const lcdTex = new THREE.CanvasTexture(lcdCanvas); lcdTex.colorSpace = THREE.SRGBColorSpace; lcdTex.anisotropy = 8;
const pantallaLCD = new THREE.Mesh(new THREE.PlaneGeometry(75.5, 25),
  new THREE.MeshBasicMaterial({ map:lcdTex, toneMapped:false, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 }));
pantallaLCD.position.set(39, -27.5, 13.08);        // coordenadas del módulo LCD (mm), justo sobre el vidrio azul
const ABREV_CONFORT = { 'NO CONFORTABLE':'NO CONF.', 'ACEPTABLE':'ACEPT.', 'SIN DATOS':'S/DATOS' };
function lineasLCD() {                                 // editá estas 4 líneas para que coincidan con tu Arduino
  const f = (v, fn) => v === undefined ? '--' : fn(v);
  const t = f(datos.temperatura, v => num(v) === null ? String(v) : num(v).toFixed(1) + 'C');
  const h = f(datos.humedad,     v => num(v) === null ? String(v) : Math.round(num(v)) + '%');
  const l = f(datos.luz,         v => num(v) === null ? String(v) : Math.round(num(v)));
  const r = f(datos.ruido,       v => num(v) === null ? String(v) : Math.round(num(v)));
  const g = f(datos.gases,       v => num(v) === null ? String(v) : Math.round(num(v)));
  const p = datos.presencia === undefined ? '--' : (['si','sí','1','true','on'].includes(String(datos.presencia).trim().toLowerCase()) ? 'SI' : 'NO');
  const c = datos.confort === undefined ? '--' : (ABREV_CONFORT[String(datos.confort).toUpperCase()] || String(datos.confort));
  return [`T:${t} H:${h}`, `Luz:${l}lx Rui:${r}dB`, `Aire:${g} Pres:${p}`, `Confort:${c}`].map(s => s.slice(0, 20).padEnd(20));
}
function pintarLCD() {
  const W = lcdCanvas.width, H = lcdCanvas.height, cw = W / 20, ch = H / 4, ctx = lcdCtx, lineas = lineasLCD();
  ctx.fillStyle = '#3a63e6'; ctx.fillRect(0, 0, W, H);                            // fondo azul retroiluminado
  ctx.font = `bold ${Math.round(ch * 0.78)}px "Courier New", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let r = 0; r < 4; r++) for (let c = 0; c < 20; c++) {
    ctx.fillStyle = '#2f55d3'; ctx.fillRect(c * cw + 3, r * ch + 5, cw - 6, ch - 10);   // celda del carácter
    const chr = lineas[r][c];
    if (chr !== ' ') { ctx.fillStyle = '#eef3ff'; ctx.fillText(chr, c * cw + cw / 2, r * ch + ch / 2 + 3); }
  }
  lcdTex.needsUpdate = true;
}

// ---------- carga del modelo ----------
const loader = new GLTFLoader();
const nodos = {}, nodoAClave = {};
for (const [k, s] of Object.entries(SENSORES)) nodoAClave[s.nodo] = k;
const pivote = new THREE.Group(); pivote.position.set(...PIVOTE); scene.add(pivote);   // la bisagra

async function cargar() {
  if (window.CAJA_GLB_B64) {
    const bin = Uint8Array.from(atob(window.CAJA_GLB_B64), c => c.charCodeAt(0));
    return loader.parseAsync(bin.buffer, '');
  }
  return loader.loadAsync(GLB_URL);
}
cargar().then(gltf => {
  scene.add(gltf.scene);
  gltf.scene.traverse(o => { if (o.name) nodos[o.name] = o; });
  const vistos = new Set();                                   // colores más naturales (una vez por material)
  gltf.scene.traverse(o => {
    if (!o.isMesh || !o.material || vistos.has(o.material)) return;
    vistos.add(o.material); const m = o.material;
    if (m.color) m.color.multiplyScalar(AJUSTES.brilloMateriales);
    if (m.metalness !== undefined) m.metalness = Math.min(m.metalness, AJUSTES.metalMaximo);
  });
  gltf.scene.updateMatrixWorld(true);
  if (nodos['lcd_20x4']) nodos['lcd_20x4'].add(pantallaLCD);                // la pantalla viaja con el LCD
  PARTES_TAPA.forEach(n => { if (nodos[n]) pivote.attach(nodos[n]); });   // attach conserva la posición actual
  document.getElementById('cargando').remove();
}).catch(err => {
  document.getElementById('cargando').innerHTML =
    'No se pudo cargar el modelo.<br><small>Si abriste el archivo con doble clic, dejá <b>modelo_glb_realista.js</b> en la misma carpeta; ' +
    'si usás el .glb suelto, serví la carpeta con <code>python -m http.server</code>.</small>';
  console.error(err);
});

pintarLCD();

// ---------- cables del LCD y del PIR (dinámicos) ----------
const grupoCables = new THREE.Group(); scene.add(grupoCables);
const cablesTapa = [];
for (const [k, c] of Object.entries(CABLES_TAPA)) c.colores.forEach((col, i) => {
  const mesh = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial({ color:col, roughness:0.6 }));
  grupoCables.add(mesh); cablesTapa.push({ mesh, k, i, n:c.colores.length });
});
let aperturaPrev = -1;
function actualizarCablesTapa() {
  if (Math.abs(apertura - aperturaPrev) < 1e-5) return;
  aperturaPrev = apertura;
  const eul = new THREE.Euler(pivote.rotation.x, 0, 0), piv = pivote.position;
  const rotar = v => v.clone().sub(piv).applyEuler(eul).add(piv);
  for (const w of cablesTapa) {
    const c = CABLES_TAPA[w.k], off = w.i - (w.n - 1) / 2, fila = new THREE.Vector3(...c.fila);
    const P0 = new THREE.Vector3(...c.placa).addScaledVector(fila, off * 0.00254);
    const P3 = rotar(new THREE.Vector3(...c.tapa)).addScaledVector(fila.clone().applyEuler(eul), off * 0.00254);
    const P0o = P0.clone().add(new THREE.Vector3(0, 0, 0.007));
    const P3o = P3.clone().addScaledVector(new THREE.Vector3(0, 0, -1).applyEuler(eul), 0.007);
    const D = P0.distanceTo(P3), sag = Math.sqrt(Math.max(0, (LARGO_CABLE / 2) ** 2 - (D / 2) ** 2)) * 0.8;
    const ox = off * 0.0016;
    const c1 = c.cerrada ? new THREE.Vector3(...c.cerrada[0]).add(new THREE.Vector3(ox, 0, 0))     // cerrada: ruta fija o bucle que cuelga
                         : P0o.clone().lerp(P3o, 0.33).add(new THREE.Vector3(ox, -sag, 0));
    const c2 = c.cerrada ? new THREE.Vector3(...c.cerrada[1]).add(new THREE.Vector3(ox, 0, 0))
                         : P0o.clone().lerp(P3o, 0.66).add(new THREE.Vector3(ox, -sag, 0));
    const a1 = new THREE.Vector3(P0.x + ox, P0.y + 0.010, 0.036);                       // abierta: sale por el frente de la caja
    const a2 = new THREE.Vector3(P3o.x + ox, P3o.y - 0.02, Math.max(P3o.z, 0.036));
    const v1 = c1.lerp(a1, apertura), v2 = c2.lerp(a2, apertura);
    const curva = new THREE.CatmullRomCurve3([P0, P0o, v1, v2, P3o, P3], false, 'centripetal');
    w.mesh.geometry.dispose(); w.mesh.geometry = new THREE.TubeGeometry(curva, 48, 0.0006, 6, false);
  }
}

// ---------- tapa: apertura animada ----------
let objetivoTapa = 0, progreso = 0, apertura = 0;
function abrirTapa(abrir) {
  if (objetivoTapa === (abrir ? 1 : 0)) return;
  objetivoTapa = abrir ? 1 : 0;
  const b = document.getElementById('bTapa');
  b.classList.toggle('on', !!abrir); b.textContent = abrir ? 'Cerrar tapa' : 'Abrir tapa';
  const v = abrir ? VISTA_ABIERTA : VISTA_CERRADA; irA(v[0], v[1]);
}

// ---------- interacción ----------
let seleccion = null, anim = null, etiquetasOn = true, hoverOn = false;
const originales = new Map();
function resaltar(k, on) {
  const raiz = nodos[SENSORES[k].nodo]; if (!raiz) return;
  raiz.traverse(o => {
    if (!o.isMesh) return;
    if (on) {
      originales.set(o, o.material);
      const m = o.material.clone();
      if (m.emissive) { m.emissive = new THREE.Color(0xd4af37); m.emissiveIntensity = 0.45; }
      o.material = m;
    } else if (originales.has(o)) { o.material = originales.get(o); originales.delete(o); }
  });
}
function irA(pos, objetivo) { anim = { p:new THREE.Vector3(...pos), t:new THREE.Vector3(...objetivo) }; }
function anclaje(s, pos, nrm) {
  pos.set(...s.pos); nrm.set(...s.n);
  if (s.tapa) {
    pos.sub(pivote.position).applyEuler(pivote.rotation).add(pivote.position);
    nrm.applyEuler(pivote.rotation);
    if (apertura > 0.5) nrm.negate();
  }
  pos.addScaledVector(nrm, s.tapa && apertura > 0.5 ? 0.03 : 0.012);
}
function seleccionar(k) {
  if (seleccion) resaltar(seleccion, false);
  seleccion = k;
  const info = document.getElementById('info');
  if (!k) { info.style.display = 'none'; Object.values(etiquetas).forEach(e => e.classList.remove('sel')); return; }
  const s = SENSORES[k];
  Object.entries(etiquetas).forEach(([kk, e]) => e.classList.toggle('sel', kk === k));
  resaltar(k, true);
  info.style.display = 'block';
  info.querySelector('h3').textContent = s.titulo;
  info.querySelector('.tp').textContent = BASE_TOPICO + k + (s.extra ? ` · ${BASE_TOPICO}${s.extra}` : '');
  info.querySelector('.val').textContent = textoSensor(k);
  info.querySelector('p').textContent = s.desc;
  const p = new THREE.Vector3(), n = new THREE.Vector3(); anclaje(s, p, n);
  const arriba = Math.abs(n.y) > 0.7;
  irA([p.x + n.x*0.28, p.y + n.y*0.28 + (arriba ? 0 : 0.04), p.z + n.z*0.28 + (arriba ? 0.12 : 0)], [p.x, p.y, p.z]);
}
const VISTAS = { frente:[[0,0.02,0.5],[0,0,0]], izq:[[-0.5,0.02,0.04],[0,0,0]], der:[[0.5,0.02,0.04],[0,0,0]], arriba:[[0,0.52,0.1],[0,0,0]] };
document.querySelectorAll('[data-vista]').forEach(b => b.addEventListener('click', () => { const v = VISTAS[b.dataset.vista]; irA(v[0], v[1]); }));
document.getElementById('bTapa').addEventListener('click', () => abrirTapa(!objetivoTapa));
document.getElementById('bHover').addEventListener('click', e => { hoverOn = !hoverOn; e.currentTarget.classList.toggle('on', hoverOn); });
document.getElementById('bEtiq').addEventListener('click', e => { etiquetasOn = !etiquetasOn; e.currentTarget.classList.toggle('on', etiquetasOn); });
document.getElementById('bRot').addEventListener('click', e => { controls.autoRotate = !controls.autoRotate; e.currentTarget.classList.toggle('on', controls.autoRotate); });
document.getElementById('bCables').addEventListener('click', e => {
  const on = !e.currentTarget.classList.contains('on'); e.currentTarget.classList.toggle('on', on);
  grupoCables.visible = on; if (nodos['cableado']) nodos['cableado'].visible = on;
});

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null, esperando = false;
function golpe(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(scene.children, true)[0] || null;
}
const esDeTapa = o => { while (o) { if (PARTES_TAPA.includes(o.name)) return true; o = o.parent; } return false; };
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const hit = golpe(e); let o = hit && hit.object, k = null;
  while (o && !k) { k = nodoAClave[o.name] || null; o = o.parent; }
  seleccionar(k);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!hoverOn || e.buttons || esperando) return;
  esperando = true;
  requestAnimationFrame(() => {
    esperando = false;
    const hit = golpe(e);
    if (hit && esDeTapa(hit.object)) abrirTapa(true);
    else if (!hit) abrirTapa(false);
  });
});

// ---------- bucle ----------
const reloj = new THREE.Clock();
const P = new THREE.Vector3(), N = new THREE.Vector3(), tmp = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(reloj.getDelta(), 0.05);
  progreso = THREE.MathUtils.damp(progreso, objetivoTapa, 4, dt);               // velocidad de apertura: subí/bajá el 4
  if (Math.abs(progreso - objetivoTapa) < 0.001) progreso = objetivoTapa;
  apertura = progreso * progreso * (3 - 2 * progreso);
  pivote.rotation.x = -ANGULO_APERTURA * apertura;
  actualizarCablesTapa();
  if (anim) {
    camera.position.lerp(anim.p, 0.07); controls.target.lerp(anim.t, 0.07);
    if (camera.position.distanceTo(anim.p) < 0.002) anim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  const w = app.clientWidth, h = app.clientHeight;
  for (const [k, s] of Object.entries(SENSORES)) {
    const el = etiquetas[k];
    anclaje(s, P, N);
    const mirando = tmp.copy(camera.position).sub(P).dot(N) > 0;
    const p = P.clone().project(camera);
    el.classList.toggle('off', !etiquetasOn || !mirando || p.z > 1);
    el.style.left = ((p.x * 0.5 + 0.5) * w) + 'px';
    el.style.top = ((-p.y * 0.5 + 0.5) * h) + 'px';
  }
}
frame();

// ---------- API para el dashboard ----------
let simTimer = null;
function actualizar(nuevos, enVivo = true) {
  Object.assign(datos, nuevos);
  refrescarTextos();
  if (enVivo) {
    if (simTimer) { clearInterval(simTimer); simTimer = null; }
    document.getElementById('modo').innerHTML = '<i></i>En vivo';
  }
}
window.Caja3D = { actualizar, seleccionar, abrirTapa, vista: n => { const v = VISTAS[n]; if (v) irA(v[0], v[1]); } };
window.addEventListener('message', e => { if (e.data && e.data.tipo === 'caja3d') actualizar(e.data.datos || {}); });

if (SIMULAR) {
  const rnd = (a, b) => a + Math.random() * (b - a);
  const sim = () => actualizar({
    temperatura: rnd(22, 28), humedad: rnd(40, 70), luz: rnd(80, 400), ruido: rnd(35, 65), gases: rnd(300, 900),
    presencia: Math.random() > 0.4 ? 'si' : 'no', confort: ['OK', 'ACEPTABLE', 'NO CONFORTABLE'][Math.floor(Math.random() * 3)]
  }, false);
  sim(); simTimer = setInterval(sim, 3000);
} else { document.getElementById('modo').innerHTML = '<i></i>Esperando datos…'; }
</script>
